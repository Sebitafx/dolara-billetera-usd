<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1140" viewBox="0 0 1320 1140" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1320" height="1140" fill="#ffffff"/>
  <text x="60" y="52" font-size="26" font-weight="700" fill="#1a202c">DOLARA por capas <tspan font-size="15" font-weight="400" fill="#64748b">(cada capa solo depende de la de abajo ⬇)</tspan></text>

  <!-- Capa 1 Cliente -->
  <rect x="140" y="80" width="900" height="104" rx="12" fill="#e3edf9" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="164" y="114" font-size="18" font-weight="700" fill="#1a365d">1 · Cliente — SPA Angular :4200</text>
  <text x="164" y="140" font-size="13.5" fill="#1a365d">7 pantallas (/acceso · /inicio · /billetera · /depositar · /transferir · /historial · /fx) + guard + sesión alias+PIN</text>
  <text x="164" y="162" font-size="13.5" fill="#1a365d">Habla solo con la capa 2 por REST /api/v1 (nunca directo a la BD)</text>

  <line x1="590" y1="184" x2="590" y2="206" stroke="#475569" stroke-width="3" marker-end="url(#c1)"/>
  <text x="604" y="202" font-size="12" fill="#475569">HTTPS + Idempotency-Key</text>

  <!-- Capa 2 Entrada -->
  <rect x="140" y="210" width="900" height="104" rx="12" fill="#ebf3fd" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="164" y="244" font-size="18" font-weight="700" fill="#1a365d">2 · Entrada API — routes/ :3001</text>
  <text x="164" y="270" font-size="13.5" fill="#1a365d">deposits · billetera · fx · health + zod + X-Correlation-Id + Swagger /docs</text>
  <text x="164" y="292" font-size="13.5" fill="#1a365d">Valida y delega al core; jamás toca la BD ni URLs externas</text>

  <line x1="590" y1="314" x2="590" y2="336" stroke="#475569" stroke-width="3" marker-end="url(#c1)"/>
  <text x="604" y="332" font-size="12" fill="#475569">llamada local</text>

  <!-- Capa 3 Core -->
  <rect x="140" y="340" width="900" height="128" rx="12" fill="#e2f4e7" stroke="#1e9e5a" stroke-width="3"/>
  <text x="164" y="374" font-size="18" font-weight="700" fill="#0f5132">3 · Núcleo — usecases/ + domain/ + money.ts 💎</text>
  <text x="164" y="400" font-size="13.5" fill="#0f5132">create-deposit (15 pasos) · MoneyUsd + estados · toCents/add/sub/gte, cero floats (C2)</text>
  <text x="164" y="422" font-size="13.5" fill="#0f5132">Solo conoce puertos (tipos TS): cero imports de pg, fetch o URLs</text>
  <text x="164" y="444" font-size="13.5" fill="#0f5132">* billetera opera directo a SQL (excepción documentada: CRUD local sin integración)</text>

  <line x1="590" y1="468" x2="590" y2="490" stroke="#475569" stroke-width="3" marker-end="url(#c1)"/>
  <text x="604" y="486" font-size="12" fill="#475569">solo tipos, no código</text>

  <!-- Capa 4 Puertos -->
  <rect x="140" y="494" width="900" height="104" rx="12" fill="#f2f5fa" stroke="#64748b" stroke-width="2.5"/>
  <text x="164" y="528" font-size="18" font-weight="700" fill="#1a202c">4 · Puertos — ports.ts (contratos del core)</text>
  <text x="164" y="554" font-size="13.5" fill="#1a202c">CustomerAccountPort.validateUsdDestination · BalancePort.credit('USD', referenceId)</text>
  <text x="164" y="576" font-size="13.5" fill="#1a202c">Los define el negocio; los adaptadores se someten a ellos (no al revés)</text>

  <line x1="590" y1="598" x2="590" y2="620" stroke="#475569" stroke-width="3" marker-end="url(#c1)"/>
  <text x="604" y="616" font-size="12" fill="#475569">implementan</text>

  <!-- Capa 5 Adaptadores -->
  <rect x="140" y="624" width="900" height="128" rx="12" fill="#fff8e6" stroke="#b7791f" stroke-width="2.5"/>
  <text x="164" y="658" font-size="18" font-weight="700" fill="#713f12">5 · Adaptadores — enchufes intercambiables 🔧</text>
  <text x="164" y="684" font-size="13.5" fill="#713f12">🎭 fakes.ts (Etapa A: A=USD·B=Bloq·C=PEN + wallets) ⇄ 🌐 http.ts (:3002/:3003, timeout 3s)</text>
  <text x="164" y="706" font-size="13.5" fill="#713f12">💾 db.ts pool PG · 💱 fx.ts exchangerate (caché 60 min) · USE_FAKES conmuta sin tocar el core</text>
  <text x="164" y="728" font-size="13.5" fill="#713f12"> </text>

  <line x1="590" y1="752" x2="590" y2="774" stroke="#475569" stroke-width="3" marker-end="url(#c1)"/>
  <text x="604" y="770" font-size="12" fill="#475569">SQL / HTTP</text>

  <!-- Capa 6 Datos y externos -->
  <rect x="140" y="778" width="900" height="128" rx="12" fill="#e2ecf7" stroke="#2f6fb2" stroke-width="2.5"/>
  <text x="164" y="812" font-size="18" font-weight="700" fill="#1a365d">6 · Datos y mundo exterior</text>
  <text x="164" y="838" font-size="13.5" fill="#1a365d">🛢️ Postgres 16 :5433 — 5 tablas, BD propia que nadie más toca (C11)</text>
  <text x="164" y="860" font-size="13.5" fill="#1a365d">🏦 Clientes/Saldos reales + 🔑 Gateway JWT — futuro punteado (Etapas B/C/D)</text>
  <text x="164" y="882" font-size="13.5" fill="#1a365d"> </text>

  <!-- Flecha prohibida -->
  <line x1="1100" y1="830" x2="1100" y2="360" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1100" y="340" font-size="34" font-weight="800" text-anchor="middle" fill="#dc2626">✕</text>
  <text x="1116" y="500" font-size="13.5" font-weight="700" fill="#991b1b">PROHIBIDO</text>
  <text x="1116" y="522" font-size="13" fill="#991b1b">el core jamás importa</text>
  <text x="1116" y="542" font-size="13" fill="#991b1b">adaptadores (verificado:</text>
  <text x="1116" y="562" font-size="13" fill="#991b1b">create-deposit.ts solo</text>
  <text x="1116" y="582" font-size="13" fill="#991b1b">importa tipos de ports)</text>

  <!-- Microservicios rail -->
  <text x="140" y="946" font-size="14" fill="#1a202c">Todo lo anterior vive dentro de <tspan font-weight="700">un microservicio</tspan>: SPA → API → PG propios + red wallet-network; Clientes/Saldos/Gateway son otros equipos (Nivel microservicios en arquitectura-dolara.png).</text>

  <!-- Leyenda -->
  <rect x="140" y="966" width="900" height="120" rx="12" fill="#f2f5fa" stroke="#b9c6dd" stroke-width="2"/>
  <text x="164" y="1000" font-size="16" font-weight="700" fill="#1a202c">Cómo leerlo</text>
  <text x="164" y="1024" font-size="13" fill="#1a202c">De arriba hacia abajo: cada capa solo ve la inmediata inferior. La flecha roja es la regla de oro: ninguna dependencia sube.</text>
  <text x="164" y="1046" font-size="13" fill="#1a202c">Azul = borde · Verde = tu lógica · Gris = contratos · Ámbar = enchufes · * = excepción honesta y documentada.</text>
</svg>
