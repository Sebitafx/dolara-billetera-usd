<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#2b6cb0"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#1e9e5a"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b46c1"/></marker>
  </defs>
  <rect x="0" y="0" width="1320" height="1000" fill="#ffffff"/>
  <text x="60" y="52" font-size="26" font-weight="700" fill="#1a202c">DOLARA — Microservicios por fuera, hexagonal por dentro</text>

  <!-- ================= NIVEL 1 ================= -->
  <text x="60" y="100" font-size="19" font-weight="700" fill="#2b6cb0">Nivel 1 · Microservicios (el sistema distribuido)</text>
  <text x="60" y="122" font-size="13.5" fill="#4a5568">Cada equipo posee su servicio + su BD · contratos REST versionados · red wallet-network</text>

  <g>
    <rect x="60" y="140" width="250" height="150" rx="12" fill="#e3edf9" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="84" y="176" font-size="17" font-weight="700" fill="#1a365d">📱 SPA DOLARA</text>
    <text x="84" y="200" font-size="13" fill="#1a365d">Angular 18 · :4200</text>
    <text x="84" y="222" font-size="13" fill="#1a365d">7 pantallas + guard</text>
    <text x="84" y="244" font-size="13" fill="#1a365d">sesión alias+PIN</text>
    <text x="84" y="266" font-size="13" fill="#1a365d"> </text>
  </g>
  <g>
    <rect x="350" y="140" width="300" height="150" rx="12" fill="#e2f4e7" stroke="#1e9e5a" stroke-width="3"/>
    <text x="374" y="176" font-size="17" font-weight="700" fill="#0f5132">🟩 API DOLARA :3001</text>
    <text x="374" y="200" font-size="13" fill="#0f5132">deposits · billetera · fx</text>
    <text x="374" y="222" font-size="13" fill="#0f5132">health · /docs · hexagonal</text>
    <text x="374" y="244" font-size="13" fill="#0f5132">dentro (ver Nivel 2 ⬇)</text>
    <text x="374" y="266" font-size="13" fill="#0f5132"> </text>
  </g>
  <g>
    <rect x="690" y="140" width="270" height="150" rx="12" fill="#e2ecf7" stroke="#2f6fb2" stroke-width="2.5"/>
    <text x="714" y="176" font-size="17" font-weight="700" fill="#1a365d">🛢️ Postgres 16</text>
    <text x="714" y="200" font-size="13" fill="#1a365d">host :5433 · propia,</text>
    <text x="714" y="222" font-size="13" fill="#1a365d">nadie más la toca (C11)</text>
    <text x="714" y="244" font-size="13" fill="#1a365d">5 tablas · v1+v2+v3</text>
  </g>
  <g>
    <rect x="1000" y="140" width="260" height="150" rx="12" fill="#f2f5fa" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 5"/>
    <text x="1024" y="176" font-size="17" font-weight="700" fill="#475569">🏦 Clientes/Saldos</text>
    <text x="1024" y="200" font-size="13" fill="#475569">Hoy: fakes (Etapa A)</text>
    <text x="1024" y="222" font-size="13" fill="#475569">B/C: HTTP :3002/:3003</text>
    <text x="1024" y="244" font-size="13" fill="#475569">Gateway+JWT futuro</text>
  </g>

  <line x1="310" y1="215" x2="342" y2="215" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a1)"/>
  <text x="326" y="242" font-size="11" fill="#1a365d">REST</text>
  <line x1="650" y1="215" x2="682" y2="215" stroke="#1e9e5a" stroke-width="3" marker-end="url(#a2)"/>
  <text x="660" y="242" font-size="11" fill="#0f5132">SQL</text>
  <text x="660" y="312" font-size="12.5" fill="#64748b" text-anchor="middle">puertos/adaptadores (C9): el caso de uso no cambia al integrar</text>

  <!-- ================= NIVEL 2 ================= -->
  <text x="60" y="360" font-size="19" font-weight="700" fill="#1e9e5a">Nivel 2 · Hexagonal dentro de la API (zoom al cuadro verde ⬆)</text>
  <text x="60" y="382" font-size="13.5" fill="#4a5568">El core no conoce URLs: solo habla con puertos · los adaptadores se enchufan por USE_FAKES</text>

  <g>
    <rect x="60" y="400" width="220" height="330" rx="12" fill="#f4f8fd" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="84" y="436" font-size="16" font-weight="700" fill="#1a365d">→ Entrada</text>
    <text x="84" y="462" font-size="13" fill="#1a365d">routes/deposits.ts</text>
    <text x="84" y="484" font-size="13" fill="#1a365d">routes/billetera.ts</text>
    <text x="84" y="506" font-size="13" fill="#1a365d">routes/fx.ts</text>
    <text x="84" y="528" font-size="13" fill="#1a365d">+ zod + Idem-Key</text>
    <text x="84" y="556" font-size="13" fill="#1a365d">SPA → REST /api/v1</text>
    <text x="84" y="584" font-size="13" fill="#1a365d">/docs · /health</text>
    <text x="84" y="612" font-size="13" fill="#1a365d">X-Correlation-Id</text>
    <text x="84" y="640" font-size="13" fill="#1a365d"> </text>
    <text x="84" y="668" font-size="13" fill="#1a365d"> </text>
    <text x="84" y="696" font-size="13" fill="#1a365d"> </text>
  </g>

  <g>
    <rect x="300" y="400" width="330" height="330" rx="12" fill="#e2f4e7" stroke="#1e9e5a" stroke-width="3"/>
    <text x="324" y="436" font-size="16" font-weight="700" fill="#0f5132">💎 Core (sin URLs)</text>
    <text x="324" y="462" font-size="13" fill="#0f5132">usecases/create-deposit</text>
    <text x="324" y="484" font-size="13" fill="#0f5132">(15 pasos · RF-1..5)</text>
    <text x="324" y="512" font-size="13" fill="#0f5132">domain/deposit.ts</text>
    <text x="324" y="534" font-size="13" fill="#0f5132">(MoneyUsd + estados)</text>
    <text x="324" y="562" font-size="13" fill="#0f5132">money.ts: toCents/add/</text>
    <text x="324" y="584" font-size="13" fill="#0f5132">sub/gte · half-up (C2)</text>
    <text x="324" y="612" font-size="13" fill="#0f5132">billetera: operar +</text>
    <text x="324" y="634" font-size="13" fill="#0f5132">transfer alias→UUID</text>
    <text x="324" y="662" font-size="13" fill="#0f5132">fx.ts: caché 60 min</text>
    <text x="324" y="690" font-size="13" fill="#0f5132"> </text>
  </g>

  <g>
    <rect x="650" y="400" width="240" height="330" rx="12" fill="#f2f5fa" stroke="#64748b" stroke-width="2.5"/>
    <text x="674" y="436" font-size="16" font-weight="700" fill="#1a202c">🔌 Puertos</text>
    <text x="674" y="462" font-size="13" fill="#1a202c">CustomerAccountPort</text>
    <text x="674" y="484" font-size="12" fill="#4a5568" font-family="Consolas, monospace">validateUsdDest.</text>
    <text x="674" y="516" font-size="13" fill="#1a202c">BalancePort</text>
    <text x="674" y="538" font-size="12" fill="#4a5568" font-family="Consolas, monospace">credit 'USD'</text>
    <text x="674" y="570" font-size="13" fill="#1a202c">interfaces TS</text>
    <text x="674" y="592" font-size="13" fill="#1a202c">(ports.ts) · el core</text>
    <text x="674" y="614" font-size="13" fill="#1a202c">solo los conoce</text>
    <text x="674" y="642" font-size="13" fill="#1a202c">a ellos</text>
  </g>

  <g>
    <rect x="910" y="400" width="350" height="330" rx="12" fill="#fff8e6" stroke="#b7791f" stroke-width="2.5"/>
    <text x="934" y="436" font-size="16" font-weight="700" fill="#713f12">🔧 Adaptadores</text>
    <text x="934" y="462" font-size="13" fill="#713f12">🎭 fakes.ts (Etapa A)</text>
    <text x="934" y="484" font-size="13" fill="#713f12">A=USD · B=Bloq · C=PEN</text>
    <text x="934" y="506" font-size="13" fill="#713f12">+ wallets registradas</text>
    <text x="934" y="534" font-size="13" fill="#713f12">🌐 http.ts (Etapa B/C)</text>
    <text x="934" y="556" font-size="13" fill="#713f12">:3002 · :3003 · timeout 3s</text>
    <text x="934" y="584" font-size="13" fill="#713f12">💾 db.ts (PG :5433)</text>
    <text x="934" y="606" font-size="13" fill="#713f12">💱 exchangerate.host</text>
    <text x="934" y="634" font-size="13" fill="#713f12">USE_FAKES conmuta</text>
    <text x="934" y="656" font-size="13" fill="#713f12">sin tocar el core</text>
  </g>

  <line x1="280" y1="565" x2="292" y2="565" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a1)"/>
  <line x1="630" y1="565" x2="642" y2="565" stroke="#1e9e5a" stroke-width="3" marker-end="url(#a2)"/>
  <line x1="890" y1="565" x2="902" y2="565" stroke="#b7791f" stroke-width="3"/>

  <text x="60" y="780" font-size="14" fill="#1a202c">Flujo de una request: <tspan font-weight="700">SPA → routes → core → puertos → adaptadores → PG/externos</tspan> · respuesta con {code, correlation_id}</text>

  <!-- Leyenda -->
  <rect x="60" y="810" width="1200" height="150" rx="12" fill="#f2f5fa" stroke="#b9c6dd" stroke-width="2"/>
  <text x="84" y="846" font-size="17" font-weight="700" fill="#1a202c">Cómo leerlo</text>
  <text x="84" y="874" font-size="13.5" fill="#1a202c">Arriba = despliegue distribuido (cada microservicio con su BD, se cae uno y el resto sigue). Abajo = zoom a tu API: el hexágono que te deja desarrollar con fakes e integrar después sin reescribir.</text>
  <text x="84" y="900" font-size="13.5" fill="#1a202c">Azul = borde del sistema · Verde = tu código · Gris = contratos · Ámbar = enchufes intercambiables · Punteado = futuro (Gateway, MS reales).</text>
  <text x="84" y="926" font-size="13.5" fill="#1a202c"> </text>
</svg>
