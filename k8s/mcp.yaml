apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sandbox
  namespace: default
  labels:
    app: mcp-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sandbox
  template:
    metadata:
      labels:
        app: mcp-sandbox
    spec:
      containers:
        - name: mcp-sandbox
          image: billetera-usd-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/mcp/index.js", "--transport", "http", "--port", "3005"]
          env:
            - name: SANDBOX_API_BASE_URL
              value: http://ms-depositos-usd:3001
            - name: MCP_PORT
              value: "3005"
          ports:
            - containerPort: 3005
              name: mcp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sandbox
  namespace: default
spec:
  selector:
    app: mcp-sandbox
  ports:
    - port: 3005
      targetPort: 3005
      name: mcp
