server {
  listen 80;
  location /api/ {
    proxy_pass http://ms-depositos-usd:3001;
  }
  location /health/ {
    proxy_pass http://ms-depositos-usd:3001;
  }
  location /docs {
    proxy_pass http://ms-depositos-usd:3001;
  }
  location = /openapi.yaml {
    proxy_pass http://ms-depositos-usd:3001;
  }
  location = /openapi.json {
    proxy_pass http://ms-depositos-usd:3001;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
