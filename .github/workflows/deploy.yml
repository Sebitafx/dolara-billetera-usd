name: CI/CD Pipeline - Billetera Digital USD Kubernetes EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-billetera-usd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  EXPECTED_API_VERSION: "1.2.0"

jobs:
  test:
    name: 🧪 Run Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deposit_usd
          POSTGRES_PASSWORD: deposit_usd
          POSTGRES_DB: depositos_usd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: 🚀 Run tests with Vitest
        env:
          DATABASE_URL: postgres://deposit_usd:deposit_usd@localhost:5432/depositos_usd
          USE_FAKES: "true"
        run: |
          cd backend
          npm test

      - name: 🏗️ Build backend
        run: npm run build --prefix backend

      - name: 📦 Install frontend dependencies
        run: npm ci --prefix frontend

      - name: 🏗️ Build frontend
        run: npm run build --prefix frontend

      - name: 📜 Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.76.0 lint docs/openapi.yaml

  deploy:
    name: ☸️ Deploy to Kubernetes (EC2)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Build immutable Linux images
        run: |
          docker build --platform linux/amd64 -t "billetera-usd-backend:${GITHUB_SHA}" -f backend/Dockerfile .
          docker build --platform linux/amd64 -t "billetera-usd-frontend:${GITHUB_SHA}" ./frontend
          docker save "billetera-usd-backend:${GITHUB_SHA}" -o backend-image.tar
          docker save "billetera-usd-frontend:${GITHUB_SHA}" -o frontend-image.tar

      - name: 📤 Publish images to GHCR (registro compartido del integrador)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "billetera-usd-backend:${GITHUB_SHA}"  "ghcr.io/sebitafx/dolara-billetera-usd-backend:${GITHUB_SHA}"
          docker tag "billetera-usd-frontend:${GITHUB_SHA}" "ghcr.io/sebitafx/dolara-billetera-usd-frontend:${GITHUB_SHA}"
          docker push "ghcr.io/sebitafx/dolara-billetera-usd-backend:${GITHUB_SHA}"
          docker push "ghcr.io/sebitafx/dolara-billetera-usd-frontend:${GITHUB_SHA}"

      - name: 📦 Package exact source revision
        run: |
          tar \
            --exclude=.git \
            --exclude=backend/node_modules \
            --exclude=backend/dist \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz ./release.tar.gz

      - name: 📤 Transfer release and images
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "release.tar.gz,backend-image.tar,frontend-image.tar"
          target: "/tmp/billetera-${{ github.sha }}"

      - name: 🚀 Import images and deploy exact revision
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            RELEASE_SHA="${{ github.sha }}"
            UPLOAD_DIR="/tmp/billetera-${RELEASE_SHA}"
            RELEASE_DIR="/home/ec2-user/releases/billetera-${RELEASE_SHA}"
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "${UPLOAD_DIR}/release.tar.gz" -C "${RELEASE_DIR}"
            sudo k3s ctr images import "${UPLOAD_DIR}/backend-image.tar"
            sudo k3s ctr images import "${UPLOAD_DIR}/frontend-image.tar"
            cd "${RELEASE_DIR}"
            chmod +x scripts/deploy.sh
            SKIP_IMAGE_BUILD=true IMAGE_TAG="${RELEASE_SHA}" DEPLOY_COMMIT="${RELEASE_SHA}" bash scripts/deploy.sh
            printf '%s\n' "${RELEASE_SHA}" > DEPLOYED_COMMIT
            ln -sfn "${RELEASE_DIR}" /home/ec2-user/billetera-current
            rm -f "${UPLOAD_DIR}/release.tar.gz" "${UPLOAD_DIR}/backend-image.tar" "${UPLOAD_DIR}/frontend-image.tar"
            rmdir "${UPLOAD_DIR}"

      - name: 🔎 Verify public health and OpenAPI version
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 12 --retry-delay 5 "http://${EC2_HOST}/health/ready"
          curl --fail --retry 12 --retry-delay 5 "http://${EC2_HOST}/docs.json" -o deployed-openapi.json
          node -e "const fs=require('fs'); const api=JSON.parse(fs.readFileSync('deployed-openapi.json')); if(api.info?.version !== process.env.EXPECTED_API_VERSION) { throw new Error('OpenAPI desplegado: ' + api.info?.version + '; esperado: ' + process.env.EXPECTED_API_VERSION); }"

      - name: 📣 Notificar al integrador (repository_dispatch servicio-actualizado)
        env:
          GH_TOKEN: ${{ secrets.ORQUESTADOR_TOKEN }}
          REPO_INTEGRADOR: abigailDurand/Deposito-integrador-
          SERVICIO: billetera-usd
          IMAGEN: ghcr.io/sebitafx/dolara-billetera-usd-backend
          TAG: ${{ github.sha }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Falta ORQUESTADOR_TOKEN"
            exit 1
          fi
          if [ -z "${IMAGEN}" ] || [ -z "${TAG}" ]; then
            echo "::error::Falta IMAGEN o TAG"
            exit 1
          fi
          jq -n \
            --arg servicio "${SERVICIO}" \
            --arg imagen "${IMAGEN}" \
            --arg tag "${TAG}" \
            --arg commit "${COMMIT}" \
            '{event_type: "servicio-actualizado",
              client_payload: {servicio: $servicio,
                imagen: $imagen, tag: $tag, commit: $commit}}' \
            > payload.json
          status=$(curl --silent --show-error \
            --output respuesta.json --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO_INTEGRADOR}/dispatches" \
            --data-binary @payload.json)
          if [ "${status}" != "204" ]; then
            echo "::error::GitHub devolvio HTTP ${status}"
            cat respuesta.json
            exit 1
          fi
          echo "Aviso aceptado por el integrador (HTTP 204)"
          rm -f payload.json respuesta.json
