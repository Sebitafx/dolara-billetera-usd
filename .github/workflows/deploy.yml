name: CI/CD Pipeline - Billetera Digital USD Kubernetes EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deposit_usd
          POSTGRES_PASSWORD: deposit_usd
          POSTGRES_DB: depositos_usd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: 🚀 Run tests with Vitest
        env:
          DATABASE_URL: postgres://deposit_usd:deposit_usd@localhost:5432/depositos_usd
          USE_FAKES: "true"
        run: |
          cd backend
          npm test

  deploy:
    name: ☸️ Deploy to Kubernetes (EC2)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "Conectado al servidor EC2: $(uname -a)"
            cd /home/ec2-user/billetera-digital-usd
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
